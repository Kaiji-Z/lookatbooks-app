---
name: 功能请求
about: 提议新功能或改进
title: "[FEATURE] "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你的想法! 请描述清楚"你想要什么"以及"为什么需要"。
        
        💡 看看 [已有 Feature 请求](https://github.com/Kaiji-Z/lookatbooks-app/issues?q=label%3Aenhancement) 是否已有人提过, 有的话给 👍 投票 + 补充你的场景。

  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题
      description: 描述你目前的痛点或场景, 而不是直接说"想要 XX 功能"。先理解问题, 才有最好的方案。
      placeholder: "例: 每月要从 3 家不同银行各下载流水, 各自格式不同, 手动整理要 1 小时"
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 你心目中的解决方案
      description: 简洁描述你期望的行为。如果有备选方案也可以列出来。
      placeholder: "例: 希望能批量上传多个银行流水, 自动识别银行格式, 合并到一个期间"
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 你现在是怎么应对这个问题的? 或者你看过其他工具怎么做的?

  - type: dropdown
    id: usage-mode
    attributes:
      label: 你主要的使用方式
      options:
        - Web UI(浏览器/原生窗口)
        - CLI(命令行)
        - MCP(给 AI 助手调用)
        - 混合多种
    validations:
      required: true

  - type: checkboxes
    id: terms
    attributes:
      label: 确认
      options:
        - label: 我已搜过现有 Issues, 确认这是新需求
          required: true
